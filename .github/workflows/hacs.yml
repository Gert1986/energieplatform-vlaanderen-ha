# HACS-validatie: kan HACS deze repo als aangepaste repository (type Integratie) inladen?
# `brands` overgeslagen: enkel nodig voor de standaard HACS-winkel (logo in home-assistant/brands).
name: HACS

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration
          ignore: brands
